name: Markdown quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Install locked Markdown tools
        run: npm ci --prefix tools/markdownlint --ignore-scripts
      - name: Verify Markdown gate
        run: node --test tools/markdownlint/tool.test.mjs
      - name: Check all tracked Markdown
        run: node tools/markdownlint/check.mjs
